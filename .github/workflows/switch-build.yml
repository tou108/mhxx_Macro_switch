name: Build Switch Sysmodule

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build NSP
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libnx & tools
        run: dkp-pacman -Syu --noconfirm switch-dev

      - name: Debug - list files
        run: |
          echo "=== ファイル一覧 ==="
          ls -la
          echo "=== devkitPro tools ==="
          ls /opt/devkitpro/tools/bin/ | head -20

      - name: Build
        run: make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhxx-macro-nsp
          path: mhxx-macro.nso
          if-no-files-found: error
