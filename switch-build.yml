name: Build Switch Sysmodule

on:
  push:
    branches: [ main ]
    paths:
      - 'switch/**'
      - '.github/workflows/switch-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'switch/**'
  workflow_dispatch:

jobs:
  build:
    name: Build NSP
    runs-on: ubuntu-latest

    # devkitPro 公式 Docker イメージを使用
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libnx & tools
        run: |
          dkp-pacman -Sy --noconfirm \
            switch-dev \
            switch-libnx \
            switch-tools

      - name: Build
        working-directory: switch
        run: make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhxx-macro-nsp
          path: switch/mhxx-macro.nsp
          if-no-files-found: error

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: switch/mhxx-macro.nsp
